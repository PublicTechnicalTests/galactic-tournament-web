services:
  galactic-tournament-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: galactic-tournament-web:latest
    container_name: galactic-tournament-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      # Lightweight probe: wget is available in nginx:alpine and avoids installing curl
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
